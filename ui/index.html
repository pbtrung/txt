<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      DOMPurify (sanitizeHtml.ts) is the only thing standing between a
      maliciously-shared document's OPF description and script execution --
      this is defense-in-depth in case that's ever weakened by a future
      change (e.g. widening its allowed tags). script-src/object-src/base-uri
      are the load-bearing directives: same-origin scripts only (plus
      wasm-unsafe-eval, which leancrypto's Emscripten/WASM build needs to
      instantiate, and blob:, which data/wasmLoader.ts's own fetch+verify+
      blob-import of sqlcipher.js needs -- see that file's header comment;
      this is a real HTTP response header too (dist/_headers,
      build-integrity.mjs), not just this meta tag, specifically so it's
      inherited by data/dbWorker.ts's Worker, where that import actually
      happens -- a meta-tag CSP alone is never inherited by a Worker), no
      <object>/<embed>, no <base> tag hijacking relative URLs. connect-src is
      intentionally unrestricted here -- R2's endpoint is a per-account value
      from the user's own creds file (data/creds.ts), not a fixed host this
      policy could otherwise pin down (InstantDB/Firebase Auth's own hosts
      are fixed, but this meta tag is account-agnostic; build-integrity.mjs's
      real HTTP header narrows connect-src to the actual fixed+per-account
      hosts for a direct CDN visit -- see that file's own comment).
      style-src allows 'unsafe-inline' for this app's own style={{...}}
      JSX props (developer-authored, not attacker-influenced -- DOMPurify's
      own attribute allowlist already excludes `style` from sanitized HTML).
      font-src allows data: because Vite inlines some of the bundled
      @fontsource font files (e.g. Literata's smaller unicode-range subsets)
      as base64 data URIs rather than separate requests -- without it those
      particular @font-face srcs would be CSP-blocked and silently fall back
      to a larger non-inlined format, a needless violation for a
      same-origin, build-time-bundled asset.
      script-src's apis.google.com/www.gstatic.com and frame-src's
      www.google.com are Firebase Auth's own documented CSP requirement for
      its background reCAPTCHA Enterprise abuse-protection check on
      signInWithEmailAndPassword (confirmed against a real run -- blocking
      them doesn't fail sign-in outright today, but is exactly the kind of
      thing Firebase could start enforcing harder without notice).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://apis.google.com https://www.gstatic.com; frame-src https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Skypiea</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
