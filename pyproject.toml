[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txt"
version = "0.9999"
description = "CLI for administering the txt document-storage system"
requires-python = ">=3.14"
dependencies = [
  "requests",
  "click",
  "wasmtime",
  "brotli",
  "boto3",
  "cryptography",
  "defusedxml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
txt = "txt.cli:run"

[tool.setuptools]
packages = ["txt"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
