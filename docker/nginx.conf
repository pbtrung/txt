worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

env OWNER_FIREBASE_UID;
env FIREBASE_PROJECT_ID;
env UI_ORIGIN;
env R2_ENDPOINT;
env R2_BUCKET;
env R2_REGION;
env R2_READ_WRITE_ACCESS_KEY_ID;
env R2_READ_WRITE_SECRET_ACCESS_KEY;
env R2_TICKET_SECRET;
env RATE_LIMIT_KEY;
env SHARE_URL_TTL_SECONDS;

events {
    worker_connections 1024;
}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    resolver ${DNS_RESOLVER} ipv6=off valid=300s;

    lua_package_path "/opt/txt/lua/?.lua;/opt/txt/lua/?/init.lua;;";
    lua_shared_dict firebase_certs 1m;

    init_by_lua_block {
        require("txt.config").validate()
    }

    upstream rqlite_control {
        server 127.0.0.1:14001;
        keepalive 8;
    }

    server {
        listen 8080;
        server_tokens off;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true}';
        }

        location = /health/ready {
            access_log off;
            content_by_lua_file /opt/txt/lua/endpoints/readiness.lua;
        }

        location = /v1/keys {
            content_by_lua_file /opt/txt/lua/endpoints/owner_keys.lua;
        }

        location = /v1/r2-token {
            content_by_lua_file /opt/txt/lua/endpoints/owner_r2_credentials.lua;
        }

        location = /v1/shares {
            error_page 418 = @delete_share;
            if ($request_method = DELETE) { return 418; }
            content_by_lua_file /opt/txt/lua/endpoints/create_share.lua;
        }

        location @delete_share {
            content_by_lua_file /opt/txt/lua/endpoints/delete_share.lua;
        }

        location = /v1/shared-url {
            content_by_lua_file /opt/txt/lua/endpoints/shared_object_url.lua;
        }

        location /operator/rqlite/ {
            client_max_body_size 128k;
            add_header Access-Control-Allow-Origin "${UI_ORIGIN}" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age "600" always;
            add_header Vary "Origin" always;
            if ($request_method = OPTIONS) { return 204; }
            auth_basic "txt rqlite operator";
            auth_basic_user_file ${RQLITE_ADMIN_HTPASSWD};
            proxy_pass http://rqlite_control/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}';
        }
    }
}
