# Generate /etc/nginx/.htpasswd:
#   htpasswd -c /etc/nginx/.htpasswd <username>
#   htpasswd /etc/nginx/.htpasswd <username>   # append additional users
# If htpasswd is unavailable:
#   openssl passwd -apr1 <password>            # copy output into .htpasswd as: username:<hash>

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Sized for up to 5 concurrent accounts (1 admin, read+write, + 4
    # read-only users) -- not 1. Each unlock alone is a burst, not a steady
    # trickle: dbWorker.ts's open() fires resolveTargetDbId (admin only) +
    # GET_META + prefetchPages' handful of batched READ_PAGE round trips in
    # quick succession, so 5 accounts unlocking around the same moment (or
    # sharing one IP, e.g. behind a home NAT) can land dozens of requests
    # within a couple of seconds. rate=100r/m (100 requests per 60 seconds
    # per client IP) -- comfortably above any one account's own steady-state
    # traffic (reading/bookmarking), leaving burst below for the initial spike.
    limit_req_zone  $binary_remote_addr zone=rqlite_limit:10m rate=100r/m;
    # concurrent connections per client IP -- covers each account's main
    # dbWorker.ts Worker + its own nested remotePageWorker.ts, times up to
    # 5 concurrent accounts, with slack for a second open tab.
    limit_conn_zone $binary_remote_addr zone=rqlite_conn:10m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    lua_shared_dict auth_cache 10m;
    # A COMMIT batches every dirty 4KB page into one request as an x'...'
    # hex literal (rqlite's own positional-blob-param form, not base64 --
    # see ui/src/data/rqliteHttpClient.ts's encodeBlobParam), roughly 2x a
    # page's raw size once hex-encoded (was ~3.5x with the numeric-byte-
    # array form this used before) -- ~8KB for a single dirty page alone.
    # client_max_body_size 50m (2m rejected anything but tiny documents
    # with a 413) caps the request at the proxy level, but
    # a request under that cap can still overflow client_body_buffer_size
    # (nginx's default is 8k/16k) -- when it does, nginx spills the body to a
    # temp file instead of memory, and ngx.req.get_body_data() in
    # auth_perms.lua returns nil for a disk-buffered body, which the script
    # can't tell apart from a genuinely empty/malformed one ("request body
    # is not valid JSON or missing statementId"). client_body_buffer_size 4m
    # keeps every realistic COMMIT in memory instead.
    client_max_body_size    50m;
    client_body_buffer_size 4m;
    client_body_timeout     20s;
    client_header_timeout   20s;
    keepalive_timeout       30s;
    send_timeout            10s;

    upstream rqlite {
        server 127.0.0.1:14001;
    }

    server {
        listen 4001;

        auth_basic           "rqlite";
        auth_basic_user_file ${NGINX_HTPASSWD};

        limit_conn rqlite_conn 40;

        # internal; unreachable from outside, and auth_basic would otherwise
        # reject Lua's own subrequest here too -- it inherits the client's
        # Authorization header (Bearer, not Basic) by default.
        location /internal/rqlite/ {
            internal;
            auth_basic off;
            proxy_pass http://rqlite/;
        }

        # auth_perms.lua only understands the {statementId, batch} envelope,
        # so only rqlite's own statement endpoints go through it -- anything
        # else (/status, /readyz, /nodes, /db/backup, /db/load, ...) falls
        # through to the plain passthrough location below, still behind
        # auth_basic but without the Lua rewrite.
        #
        # auth_basic is switched off here deliberately: auth_perms.lua already
        # authenticates every request on its own terms (Bearer -> SHA3-256
        # hash -> api_keys lookup), and HTTP has only one Authorization header
        # per request -- a client can never satisfy both "Basic <creds>" (what
        # auth_basic wants) and "Bearer <key>" (what the Lua script wants) at
        # once, so leaving auth_basic on here made this location unreachable
        # for every real client.
        location ~ ^/db/(query|execute|request)$ {
            auth_basic off;
            limit_req zone=rqlite_limit burst=60 nodelay;

            # ui/ calls this API directly, cross-origin, from wherever it's
            # hosted (Cloudflare Pages in production, a local Vite dev
            # server during development) -- auth here is a Bearer api_key,
            # not a cookie, so there's no ambient credential a wildcard
            # origin could leak the way there would be for cookie-based
            # auth. Set unconditionally (add_header applies to every
            # response from this location, success or auth_perms.lua's own
            # fail()/ngx.exit(), so a browser can actually read a 401 body
            # too instead of it looking like an opaque CORS failure).
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # Preflight: a JSON body + Authorization header makes this a
            # "non-simple" request, so the browser sends OPTIONS first with
            # no Authorization at all -- short-circuit before
            # auth_perms.lua (which would otherwise try, and fail, to parse
            # an empty/irrelevant body as its {statementId, batch} envelope).
            if ($request_method = OPTIONS) {
                return 204;
            }

            access_by_lua_file /script/auth_perms.lua;

            proxy_pass       http://rqlite;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        # Unauthenticated on purpose: external platform health checks (e.g.
        # Northflank's HTTP probe -- https://northflank.com/docs/v1/application
        # /observe/configure-health-checks) send a plain GET with no way to
        # supply auth_basic's Basic <creds>, and only treat 200-399 as
        # healthy. Proxies straight to rqlite's own /readyz (no query params,
        # so it requires a leader -- the same "not leader" failure mode a
        # stuck Raft identity produces reports unhealthy here too, not just
        # in the Dockerfile's own HEALTHCHECK). Reveals only node/leader/store
        # status, nothing tenant-scoped, so exposing it without auth is safe.
        location = /healthz {
            auth_basic off;
            proxy_pass http://rqlite/readyz;
        }

        location / {
            limit_req zone=rqlite_limit burst=60 nodelay;

            proxy_pass       http://rqlite;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
    }
}