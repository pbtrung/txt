worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;

    upstream rqlite_control {
        server 127.0.0.1:14001;
        keepalive 8;
    }

    server {
        listen 8080;
        server_tokens off;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true}';
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://rqlite_control/readyz;
        }

        location /operator/rqlite/ {
            auth_basic "txt rqlite operator";
            auth_basic_user_file ${RQLITE_ADMIN_HTPASSWD};
            proxy_pass http://rqlite_control/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}';
        }
    }
}
